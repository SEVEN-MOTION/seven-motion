name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/production-ready-site-normalization

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run smoke tests
        run: npm test
      - name: Build production assets
        run: npm run build
